---
layout: default
title: LB(L)T LABO
---

<style>
  /* 全体背景とコンテンツ幅の絞り込み（①幅狭め） */
  body {
    background-color: #0d1117 !important;
    color: #c9d1d9 !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
  }

  /* メインコンテンツエリア（幅を680pxにギュッと絞ってスタイリッシュに） */
  .main-container {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 20px 60px 20px;
  }

  /* ③ トップのヘッダー画像エリア */
  .header-banner {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 0 0 16px 16px;
    margin-bottom: 32px;
    border: 1px solid #30363d;
  }

  /* サイトタイトル部分 */
  .site-intro {
    text-align: center;
    margin-bottom: 40px;
  }
  .site-intro h1 {
    font-size: 1.6rem;
    color: #ffffff;
    margin: 0 0 8px 0;
    font-weight: 700;
  }
  .site-intro p {
    font-size: 0.9rem;
    color: #8b949e;
    margin: 0;
  }

  /* ② アプリアイコンのグリッド配置 */
  .app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 20px;
    justify-content: center;
  }

  /* アイコンカードのスタイル */
  .app-item {
    position: relative;
    display: block;
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    overflow: hidden;
    background: #161b22;
    border: 1px solid #30363d;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .app-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ② マウスオン（ホバー）時のオーバーレイ演出 */
  .app-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(13, 17, 23, 0.88);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 12px;
    box-sizing: border-box;
    text-align: center;
    opacity: 0; /* 通常時は非表示 */
    transition: opacity 0.2s ease;
  }

  .app-item:hover {
    transform: translateY(-4px);
    border-color: #58a6ff;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  }

  /* マウスを乗せたらテキストを表示 */
  .app-item:hover .app-overlay {
    opacity: 1;
  }

  .app-name {
    font-size: 0.85rem;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 4px;
    line-height: 1.2;
  }

  .app-desc-short {
    font-size: 0.68rem;
    color: #8b949e;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
</style>

<div class="main-container">
  <!-- ③ note風ヘッダー画像（ご自身の画像パスに変更してください） -->
  <img src="./LB(L)T LABO" alt="Header Banner" class="header-banner">

  <div class="site-intro">
    <h1>LB(L)T LABO</h1>
    <p>日常をちょっと楽しくするWEBアプリケーション集</p>
  </div>

  <!-- ①＆② コンパクトな幅で並ぶアイコンギャラリー -->
  <div class="app-grid">
    {% for app in site.data.apps %}
      <a href="{{ app.url }}" class="app-item" target="_blank" rel="noopener">
        <img src="{{ app.icon }}" alt="{{ app.name }}">
        <div class="app-overlay">
          <div class="app-name">{{ app.name }}</div>
          <div class="app-desc-short">{{ app.desc }}</div>
        </div>
      </a>
    {% endfor %}
  </div>
</div>
