---
layout: default
title: LB(L)T LABO
---

<style>
  /* 全体の背景と基本設定をダークモード化 */
  body {
    background-color: #121212 !important;
    color: #e4e4e7 !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  
  /* Jekyllのデフォルト枠線やヘッダー背景を上書き */
  .container-lg, .Header, .footer {
    background-color: #121212 !important;
    border: none !important;
  }

  .site-title-area {
    padding: 24px 0 12px 0;
    border-bottom: 1px solid #27272a;
    margin-bottom: 32px;
  }
  .site-title-area h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #ffffff;
    margin: 0;
  }

  /* カード配置（グリッド） */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  /* アプリカードの高級感ある質感 */
  .app-card {
    background: #1e1e22;
    border: 1px solid #2e2e34;
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: all 0.2s ease;
  }
  .app-card:hover {
    border-color: #52525b;
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
  }

  /* タグの装飾 */
  .tag {
    font-size: 0.75rem;
    color: #a1a1aa;
    background: #27272a;
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-block;
    margin-bottom: 16px;
    border: 1px solid #3f3f46;
  }

  /* タイトルと説明文 */
  .app-title {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 0 8px 0;
    color: #ffffff;
  }
  .app-desc {
    font-size: 0.875rem;
    color: #a1a1aa;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  /* リンクボタン */
  .btn-open {
    font-size: 0.875rem;
    font-weight: 600;
    color: #38bdf8;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color 0.15s ease;
  }
  .btn-open:hover {
    color: #7dd3fc;
    text-decoration: underline;
  }
</style>

<div class="site-title-area">
  <h1>LB(L)T LABO</h1>
</div>

<div class="card-grid">
  {% for app in site.data.apps %}
    <div class="app-card">
      <div>
        <span class="tag">{{ app.tag }}</span>
        <h3 class="app-title">{{ app.name }}</h3>
        <p class="app-desc">{{ app.desc }}</p>
      </div>
      <a href="{{ app.url }}" class="btn-open" target="_blank" rel="noopener">アプリを開く →</a>
    </div>
  {% endfor %}
</div>
